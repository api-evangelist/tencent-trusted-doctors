  These are the FIRST-PARTY npm packages published by the doctorwork.com engineering
  organisation — the engineering estate of Tencent Doctorwork (企鹅医生), one of the two
  halves of the 2018 merger that formed Tencent Trusted Doctors (企鹅杏仁). First-party
  attribution is established from the packages themselves, not from the registry name:
  @doctorwork/saga declares repository git@git.doctorwork.com:web/saga.git (the company's
  own internal GitLab), and the published @doctorwork/one micro-frontend runtime and
  @doctorwork/sso-sdk are the exact bundles still being loaded by the company's own hosts
  (https://files.xingren.com/one/v1/one.base.umd.js and https://files.xingren.com/sso/sdk.min.js
  on developer.doctorwork.com).
