aid: tencent-trusted-doctors
name: Tencent Trusted Doctors
description: >-
  Tencent Trusted Doctors (企鹅杏仁) was a Chinese digital-health group formed in August 2018
  by merging Tencent's medical unit Tencent Doctorwork (企鹅医生) with the Shanghai doctor
  platform Trusted Doctors (杏仁医生). It combined an online consultation and doctor-social
  platform with a network of bricks-and-mortar clinics, connecting roughly 440,000 verified
  physicians to more than 10 million patients, and reached unicorn valuation on a USD 250M
  round in April 2019 backed by Tencent and Country Garden Ventures. The company was
  acquired by Medlinker (医联) with the deal completing 2021-01-01, and the 企鹅杏仁 brand was
  retired in April 2021 in favour of 未来医生 (Future Doctor). It never published a public
  developer program, API reference, or machine-readable contract, and its primary domain
  xingren.com now redirects wholesale to the acquirer.
